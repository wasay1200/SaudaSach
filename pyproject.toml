[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "saudasach-model"
version = "0.1.0"
description = "Reproducible Urdu synthetic speech detection research pipeline"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn==1.8.0", "librosa==0.11.0", "soundfile==0.13.1", "joblib==1.5.3", "torch>=2.5,<3", "onnx>=1.16", "onnxruntime>=1.20", "matplotlib>=3.8", "requests>=2.31", "huggingface_hub>=0.27", "pytest>=8"]
[project.scripts]
saudasach = "saudasach.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
